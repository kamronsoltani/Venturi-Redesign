<title>TuriTap CFD Viewer</title>
<style>
/* Layout: desktop CFD post-processor. Toolbar / left dock (cases, display) / viewports / right dock (information) / bottom dock (plots, spreadsheet) / status bar. Single dark theme by design. */
:root {
  color-scheme: dark;
  --bg: #1e2124; --panel: #2a2e32; --panel2: #24282b; --hdr: #33383d; --edge: #15171a; --line: #3b4146;
  --fg: #d5d9dc; --dim: #8d969d; --sel: #2f6db3; --selfg: #ffffff; --accent: #4a9be0; --warn: #e0a040; --bad: #e0604a; --good: #6bbf7a;
  --vp-top: #4a525c; --vp-bot: #1a1d21;
  --ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: Consolas, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 12px/1.4 var(--ui); margin: 0; overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); padding-block: 0; }
.app { height: 100%; display: grid; grid-template-rows: 34px minmax(0, 1fr) 250px 22px; grid-template-columns: 250px minmax(0, 1fr) 270px;
  grid-template-areas: "tb tb tb" "left vp right" "left bot right" "sb sb sb"; }
@media (max-width: 1000px) {
  body { overflow: auto; }
  .app { height: auto; grid-template-rows: auto auto 70vh auto auto auto; grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "tb" "left" "vp" "bot" "right" "sb"; }
  .app > * { min-height: 0; }
  .bottom { height: 320px; }
}
/* toolbar */
.tb { grid-area: tb; display: flex; align-items: center; gap: 2px; background: var(--hdr); border-bottom: 1px solid var(--edge); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); overflow-x: auto; }
.tb .name { font-weight: 600; margin-right: 12px; white-space: nowrap; }
.tb .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; flex: none; }
.tbtn { font: 12px var(--ui); color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 3px 8px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.tbtn:hover { background: #3d4349; border-color: var(--line); }
.tbtn[aria-pressed="true"] { background: var(--sel); color: var(--selfg); border-color: #3a7cc4; }
.tbtn:focus-visible, select:focus-visible, input:focus-visible, .tree button:focus-visible, th:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
.tbtn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.4; }
/* docks */
.dock { background: var(--panel); border-color: var(--edge); border-style: solid; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.left { grid-area: left; border-width: 0 1px 0 0; }
.right { grid-area: right; border-width: 0 0 0 1px; }
.dhdr { background: var(--hdr); padding: 4px 8px; font-weight: 600; border-bottom: 1px solid var(--edge); border-top: 1px solid var(--edge); display: flex; justify-content: space-between; align-items: center; }
.dhdr:first-child { border-top: 0; }
.dbody { overflow: auto; min-height: 0; }
.tree { flex: 1 1 45%; }
.tree details { border-bottom: 1px solid var(--panel2); }
.tree summary { padding: 3px 8px; cursor: pointer; color: var(--fg); list-style: none; display: flex; gap: 6px; align-items: center; }
.tree summary::before { content: "▸"; color: var(--dim); width: 10px; }
.tree details[open] > summary::before { content: "▾"; }
.tree summary small { color: var(--dim); margin-left: auto; }
.tree button { display: flex; width: 100%; gap: 6px; align-items: center; text-align: left; font: 12px var(--ui); color: var(--fg); background: none; border: 0; padding: 2px 8px 2px 26px; cursor: pointer; }
.tree button:hover { background: #343a40; }
.tree button.on { background: var(--sel); color: var(--selfg); }
.tree .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
.tree .dot.flag { background: var(--warn); }
.tree .vpn { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.tree button.on .vpn { color: var(--selfg); }
.props { flex: 1 1 55%; }
.pgrid { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 5px 8px; padding: 8px; align-items: center; }
.pgrid .sec { grid-column: 1 / -1; color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: .06em; border-bottom: 1px solid var(--line); padding-top: 6px; }
.pgrid label { color: var(--dim); }
.pgrid .row2 { display: flex; gap: 4px; align-items: center; min-width: 0; }
select, input[type=number] { font: 12px var(--ui); color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 2px; padding: 2px 4px; min-width: 0; width: 100%; }
input[type=number] { font-family: var(--mono); }
input[type=range] { width: 100%; accent-color: var(--accent); min-width: 0; }
input[type=checkbox] { accent-color: var(--accent); margin: 0; }
.chk { display: flex; gap: 6px; align-items: center; color: var(--fg); }
.num { font-family: var(--mono); color: var(--fg); min-width: 34px; text-align: right; font-size: 11px; }
/* viewports */
.vpwrap { grid-area: vp; display: grid; gap: 2px; background: var(--edge); min-height: 0; }
.vpwrap.l1 { grid-template: 1fr / 1fr; } .vpwrap.l2 { grid-template: 1fr / 1fr 1fr; } .vpwrap.l3 { grid-template: 1fr / 1fr 1fr 1fr; } .vpwrap.l4 { grid-template: 1fr 1fr / 1fr 1fr; }
.vp { position: relative; min-height: 0; min-width: 0; background: linear-gradient(var(--vp-top), var(--vp-bot)); border: 1px solid transparent; }
.vp.active { border-color: var(--accent); }
.vp canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.vphdr { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 6px; align-items: center; padding: 3px 6px; background: rgba(20, 22, 25, .72); z-index: 2; }
.vphdr select { width: auto; max-width: 60%; }
.vphdr .tag { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vphdr .idx { font-family: var(--mono); color: var(--accent); }
.cbar { position: absolute; right: 8px; bottom: 8px; z-index: 2; background: rgba(20, 22, 25, .6); padding: 4px 6px; border-radius: 2px; display: grid; gap: 2px; }
.cbar canvas { position: static; width: 16px; height: 160px; }
.cbar .t { font-family: var(--mono); font-size: 10px; color: var(--fg); }
.cbar .inner { display: grid; grid-template-columns: 16px auto; gap: 4px; }
.cbar .ticks { display: flex; flex-direction: column; justify-content: space-between; height: 160px; font-family: var(--mono); font-size: 10px; }
.cbar2 { left: 8px; right: auto; }
.triad { position: absolute; left: 8px; top: 30px; z-index: 2; font-family: var(--mono); font-size: 10px; color: var(--dim); line-height: 1.3; }
/* bottom dock */
.bottom { grid-area: bot; background: var(--panel); border-top: 1px solid var(--edge); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.tabs { display: flex; background: var(--hdr); border-bottom: 1px solid var(--edge); overflow-x: auto; }
.tabs button { font: 12px var(--ui); color: var(--dim); background: none; border: 0; border-right: 1px solid var(--edge); padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); background: var(--panel); }
.pane { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 0; }
.pane[hidden] { display: none !important; }
.pane .ctl { border-right: 1px solid var(--line); padding: 8px; overflow: auto; display: grid; gap: 6px; align-content: start; }
.pane .ctl label { color: var(--dim); display: grid; gap: 2px; }
.plot { min-width: 0; min-height: 0; position: relative; }
.plot svg { width: 100%; height: 100%; display: block; }
.plot text { fill: var(--dim); font: 10px var(--mono); }
.chips { display: flex; flex-wrap: wrap; gap: 3px; }
.chips label { display: flex !important; gap: 4px; align-items: center; color: var(--fg) !important; background: var(--panel2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 2px; }
.chips i { width: 9px; height: 3px; display: inline-block; }
.sheet { overflow: auto; min-height: 0; grid-column: 1 / -1; }
table { border-collapse: collapse; font-size: 11px; width: max-content; min-width: 100%; }
th, td { padding: 2px 6px; border-right: 1px solid var(--panel2); border-bottom: 1px solid var(--panel2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--hdr); color: var(--fg); font-weight: 600; cursor: pointer; user-select: none; }
td { font-family: var(--mono); }
td:first-child, th:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); z-index: 1; }
th:first-child { z-index: 2; background: var(--hdr); }
tbody tr:hover td { background: #343a40; }
tbody tr.on td { background: var(--sel); color: var(--selfg); }
td.flag { color: var(--warn); } td.bad { color: var(--bad); }
/* info panel */
.info { padding: 0 0 8px; }
.info .grp { color: var(--dim); text-transform: uppercase; font-size: 10px; letter-spacing: .06em; padding: 8px 8px 2px; border-bottom: 1px solid var(--line); }
.info dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; margin: 0; }
.info dt, .info dd { padding: 2px 8px; border-bottom: 1px solid var(--panel2); margin: 0; }
.info dt { color: var(--dim); }
.info dd { font-family: var(--mono); text-align: right; }
.info dd.flag { color: var(--warn); } .info dd.ok { color: var(--good); }
.sb { grid-area: sb; background: var(--hdr); border-top: 1px solid var(--edge); display: flex; gap: 18px; align-items: center; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.sb b { color: var(--fg); font-weight: 400; }
</style>

<div class="app">

    <button class="tbtn" data-layout="2" title="Two viewports">1×2</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function () {
"use strict";
const $ = id => document.getElementById(id);
const IDX = (await fetch("index.json").then(r => r.json())).cases;
const BYKEY = Object.fromEntries(IDX.map(c => [c.key, c]));
const GEOMS = [...new Set(IDX.map(c => c.geometry))];
const qOf = c => c.Q_lpm;
const cache = new Map();
async function load(key) {
  if (!cache.has(key)) cache.set(key, fetch(`cases/${key}.json`).then(r => r.json()).then(prep));
  return cache.get(key);
}
// derived fields + sampler
function prep(D) {
  D.cut_p0 = D.cut_p_kPa.map((row, i) => row.map((p, j) => p + 0.5 * 997 * D.cut_speed[i][j] ** 2 / 1000));
  D.F = { speed: D.cut_speed, Ux: D.cut_Ux, Ur: D.cut_Ur, p: D.cut_p_kPa, p0: D.cut_p0 };
  D.zEnd = D.z_nodes[D.z_nodes.length - 1];
  D.zc = D.z_nodes.slice(1).map((z, i) => 0.5 * (z + D.z_nodes[i]));
  const zc = D.cut_z, Rc = D.cut_R, eta = D.cut_eta, NI = zc.length, NJ = eta.length;
  const flat = {}; for (const k in D.F) flat[k] = Float32Array.from(D.F[k].flat());
  const find = (a, x) => { let lo = 0, hi = a.length - 1; if (x <= a[0]) return [0, 0]; if (x >= a[hi]) return [hi - 1, 1];
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (a[m] <= x) lo = m; else hi = m; } return [lo, (x - a[lo]) / (a[lo + 1] - a[lo])]; };
  D.Rwall = z => { const [i, f] = find(D.z_nodes, z); return D.R_nodes[i] + f * (D.R_nodes[i + 1] - D.R_nodes[i]); };
  D.sample = (z, r, keys) => {
    const [i, fi] = find(zc, z), R = Rc[i] + fi * (Rc[i + 1] - Rc[i]), e = r / R, out = {};
    let j, fj, s = 1;
    if (e >= eta[NJ - 1]) { j = NJ - 2; fj = 1; s = Math.max(0, (1 - e) / (1 - eta[NJ - 1])); } else [j, fj] = find(eta, e);
    for (const k of keys) {
      const A = flat[k], a = A[i * NJ + j] + fj * (A[i * NJ + j + 1] - A[i * NJ + j]), b = A[(i + 1) * NJ + j] + fj * (A[(i + 1) * NJ + j + 1] - A[(i + 1) * NJ + j]);
      let v = a + fi * (b - a); if (k === "Ux" || k === "Ur" || k === "speed") v *= s; out[k] = v;
    }
    return out;
  };
  return D;
}

// ---------------------------------------------------------------- colour maps
const CM = {
  viridis: [[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[109,205,89],[180,222,44],[253,231,37]],
  coolwarm: [[59,76,192],[98,130,234],[141,176,254],[184,208,249],[221,221,221],[245,196,173],[244,154,123],[222,96,77],[180,4,38]],
  jet: [[0,0,143],[0,0,255],[0,127,255],[0,255,255],[127,255,127],[255,255,0],[255,127,0],[255,0,0],[127,0,0]],
  inferno: [[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[250,193,39],[252,255,164]],

// ---------------------------------------------------------------- plots
const NS = "http://www.w3.org/2000/svg", PAL = ["#4a9be0", "#e0a040", "#6bbf7a", "#d0607a", "#a98be0", "#40c0c0", "#e0e070", "#c08060", "#909aa3"];
const vpColour = n => PAL[n];
const geomColour = g => PAL[GEOMS.indexOf(g) % PAL.length];
function niceTicks(lo, hi, n, log) {
  if (log) { const t = []; for (let e = Math.floor(lo); e <= Math.ceil(hi); e++) t.push(e); return t; }
  const span = hi - lo || 1, s0 = span / n, m = 10 ** Math.floor(Math.log10(s0)), r = s0 / m, step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * m, t = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-12; v += step) t.push(+v.toPrecision(10)); return t;
}
function plot(host, series, o) {
  const box = host.getBoundingClientRect(), W = Math.max(300, box.width), H = Math.max(140, box.height);
  const L = 58, R = 12, T = 12, B = 30;
  host.innerHTML = ""; const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); host.appendChild(svg);
  const el = (n, a, txt) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; };
  const tx = v => o.log ? Math.log10(Math.max(v, 1e-30)) : v;
  const xs = series.flatMap(s => s.pts.map(p => p[0])), ys = series.flatMap(s => s.pts.filter(p => p[1] != null && isFinite(p[1])).map(p => tx(p[1])));
  if (!xs.length) { el("text", { x: W / 2, y: H / 2, "text-anchor": "middle" }, "No data"); return; }
  let [x0, x1] = o.x || [Math.min(...xs), Math.max(...xs)];
  let y0 = o.ymin != null ? tx(o.ymin) : Math.min(...ys), y1 = o.ymax != null ? tx(o.ymax) : Math.max(...ys);
  if (o.zero && !o.log) { y0 = Math.min(y0, 0); y1 = Math.max(y1, 0); }
  if (o.ymin == null && o.ymax == null) { const p = (y1 - y0) * 0.05 || 1; y0 -= p; y1 += p; }
  const X = v => L + (v - x0) / (x1 - x0 || 1) * (W - L - R), Y = v => T + (y1 - v) / (y1 - y0 || 1) * (H - T - B);
  for (const sh of o.shade || []) el("rect", { x: X(sh[0]), y: T, width: Math.max(0, X(sh[1]) - X(sh[0])), height: H - T - B, fill: "#ffffff", "fill-opacity": 0.05 });
  for (const t of niceTicks(y0, y1, 5, o.log)) { if (t < y0 - 1e-9 || t > y1 + 1e-9) continue; el("line", { x1: L, x2: W - R, y1: Y(t), y2: Y(t), stroke: "#3b4146" }); el("text", { x: L - 5, y: Y(t) + 3, "text-anchor": "end" }, o.log ? `1e${t}` : t); }
  for (const t of o.xt || niceTicks(x0, x1, 8)) { el("line", { x1: X(t), x2: X(t), y1: T, y2: H - B, stroke: "#30363b" }); el("text", { x: X(t), y: H - B + 13, "text-anchor": "middle" }, t); }
  if (!o.log && y0 < 0 && y1 > 0) el("line", { x1: L, x2: W - R, y1: Y(0), y2: Y(0), stroke: "#8d969d" });
  for (const m of o.marks || []) { el("line", { x1: X(m[0]), x2: X(m[0]), y1: T, y2: H - B, stroke: m[1] || "#e06a2a", "stroke-dasharray": "3 3" }); if (m[2]) el("text", { x: X(m[0]) + 3, y: T + 10 }, m[2]); }
  el("text", { x: (L + W - R) / 2, y: H - 3, "text-anchor": "middle" }, o.xl);
  el("text", { x: 11, y: (T + H - B) / 2, "text-anchor": "middle", transform: `rotate(-90 11 ${(T + H - B) / 2})` }, o.yl);
  const clip = v => Math.max(y0, Math.min(y1, v));
  for (const s of series) {
    const pp = s.pts.filter(p => p[1] != null && isFinite(tx(p[1])));
    el("polyline", { points: pp.map(([a, b]) => `${X(a).toFixed(1)},${Y(clip(tx(b))).toFixed(1)}`).join(" "), fill: "none", stroke: s.c, "stroke-width": s.w || 1.6, "stroke-dasharray": s.dash || "" });
    if (s.dots) for (const [a, b] of pp) el("circle", { cx: X(a), cy: Y(clip(tx(b))), r: 2.6, fill: s.c });
  }
  // legend
  let lx = L + 8; const ly = T + 4;
  for (const s of series.filter(s => s.name)) { el("line", { x1: lx, x2: lx + 14, y1: ly + 4, y2: ly + 4, stroke: s.c, "stroke-width": 2, "stroke-dasharray": s.dash || "" }); const t = el("text", { x: lx + 18, y: ly + 7, fill: "#d5d9dc" }, s.name); lx += 26 + s.name.length * 6; }
}
function vpSeries() { return visibleVPs().map(v => ({ v, D: v.D, c: vpColour(v.n), name: `${v.n + 1}: ${v.key.replace("__", " ")}` })); }
function plotWall() {
  const q = $("wpVar").value, ymin = $("wpYmin").value, ymax = $("wpYmax").value, S = vpSeries();
  const series = S.map(s => ({ name: s.name, c: s.c, pts: q === "R" ? s.D.z_nodes.map((z, i) => [z, s.D.R_nodes[i]]) : (q === "p" ? s.D.wall_p_kPa : s.D.wall_tau_Pa).map((v, i) => [s.D.zc[i], v]) }));
  const marks = $("wpPort").checked ? S.map(s => [s.D.port_z, s.c, "port"]) : [];
  const shade = $("wpDiff").checked ? S.map(s => s.D.diffuser) : [];
  plot($("plotWall"), series, { xl: "z below inlet face (mm)", yl: { p: "wall pressure (kPa)", tau: "axial wall shear (Pa)", R: "wall radius (mm)" }[q], marks, shade, ymin: ymin === "" ? null : +ymin, ymax: ymax === "" ? null : +ymax });
}
function plotLine() {
  const q = $("lnVar").value, norm = $("lnNorm").checked, S = vpSeries(), radial = UI.lnDir === "radial";
  $("lnPosLab").textContent = radial ? "z / length" : "r / R";
  $("lnPosV").textContent = UI.lnPos.toFixed(2);
  const series = S.map(s => {
    const D = s.D, pts = [];
    if (radial) {
      const z = UI.lnPos * D.zEnd, R = D.Rwall(z), Qm = BYKEY[s.v.key].Q_lpm / 60000, um = Qm / (Math.PI * (R / 1000) ** 2);
      for (let k = -60; k <= 60; k++) { const rr = Math.abs(k) / 60 * R * 0.9999, v = D.sample(z, rr, [q])[q]; pts.push([k / 60, norm ? v / um : v]); }
    } else {
      for (let i = 0; i < D.z_nodes.length; i += 2) { const z = D.z_nodes[i], R = D.Rwall(z), Qm = BYKEY[s.v.key].Q_lpm / 60000, um = Qm / (Math.PI * (R / 1000) ** 2), v = D.sample(z, UI.lnPos * R, [q])[q]; pts.push([z, norm ? v / um : v]); }
    }
    return { name: s.name, c: s.c, pts };
  });
  plot($("plotLine"), series, { xl: radial ? "r / R" : "z below inlet face (mm)", yl: (norm ? "÷ mean velocity: " : "") + FIELD_LABEL[q], zero: true, x: radial ? [-1, 1] : null, xt: radial ? [-1, -0.5, 0, 0.5, 1] : null });
}
const SWEEP = [
  ["level_above_inlet_cm", "Level above inlet (cm)"], ["inlet_static_Pa", "Inlet static pressure (Pa)"], ["port_wall_p_kPa_orifice_avg", "Port wall pressure (kPa)"],
  ["min_wall_p_kPa", "Minimum wall pressure (kPa)"], ["diffuser_recovery_frac_of_ideal", "Diffuser recovery (fraction of ideal)"], ["diffuser_reversed_wall_length_frac", "Reversed diffuser wall (fraction)"],
  ["diffuser_wall_shear_min_Pa", "Minimum diffuser wall shear (Pa)"], ["outlet_KE_head_cm", "Outlet jet head (cm)"], ["outlet_KE_alpha", "Outlet alpha"], ["internal_loss_cm", "Internal loss (cm)"],
  ["inlet_total_Pa", "Inlet total pressure (Pa)"], ["yplus_max", "y+ max"], ["mass_imbalance_rel", "Mass imbalance"],
];
const swOn = new Set(["V1", "V2", "V3", "V4", "B_1in"]);
function plotSweep() {
  const k = $("swVar").value;
  const series = GEOMS.filter(g => swOn.has(g)).map(g => ({ name: g, c: geomColour(g), dots: true,
    pts: IDX.filter(c => c.geometry === g && c.mesh_level === "medium").sort((a, b) => a.Q_lpm - b.Q_lpm).map(c => [c.Q_lpm, c[k]]) }));
  plot($("plotSweep"), series, { xl: "flow (L/min)", yl: SWEEP.find(s => s[0] === k)[1], zero: k === "level_above_inlet_cm" || k === "inlet_static_Pa", xt: [6, 8, 12, 20, 25, 30, 40, 50] });
}
function plotConv() {
  const vsel = $("cvVp"); const n = vsel.value === "" ? active : +vsel.value, v = VPS[n]; if (!v || !v.D) return;
  const H = v.D.residuals, I = v.D.inlet_p_hist;
  if ($("cvVar").value === "res") {
    const C = { p: "#4a9be0", Ux: "#e0a040", Uy: "#6bbf7a", k: "#d0607a", omega: "#a98be0" };
    plot($("plotConv"), Object.keys(C).map(f => ({ name: f, c: C[f], pts: H.it.map((t, i) => [t, H[f][i]]) })), { xl: "iteration", yl: "initial residual", log: true });
  } else plot($("plotConv"), [{ name: "inlet static pressure", c: "#4a9be0", pts: I.it.map((t, i) => [t, I.level_cm[i]]) }], { xl: "iteration", yl: "p_in,static / rho g (cm)" });
}
const COLS = [["key", "Case", null], ["Q_lpm", "Q", 0], ["level_above_inlet_cm", "Level cm", 2], ["inlet_static_Pa", "p_in,s Pa", 0], ["port_wall_p_kPa_orifice_avg", "Port kPa", 3], ["min_wall_p_kPa", "Min wall kPa", 3],
  ["diffuser_recovery_frac_of_ideal", "Recovery", 3], ["diffuser_reversed_wall_length_frac", "Rev. wall", 3], ["outlet_KE_head_cm", "Jet cm", 2], ["outlet_KE_alpha", "Alpha", 2], ["internal_loss_cm", "Loss cm", 2],
  ["drop_cm", "Drop cm", 1], ["yplus_max", "y+ max", 2], ["mass_imbalance_rel", "Mass imb", "e"], ["iterations", "Iter", 0], ["cells", "Cells", 0]];
let sortK = "key", sortDir = 1;
function sheet() {
  const rows = IDX.slice().sort((a, b) => { const x = a[sortK], y = b[sortK]; return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir; });
  const vpKeys = new Set(visibleVPs().map(v => v.key));
  $("sheet").innerHTML = `<table><thead><tr>${COLS.map(([k, h]) => `<th tabindex="0" data-k="${k}">${h}${sortK === k ? (sortDir > 0 ? " ▴" : " ▾") : ""}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(c => `<tr data-key="${c.key}" class="${vpKeys.has(c.key) ? "on" : ""}">` + COLS.map(([k, , d]) => {
      const v = c[k], cls = (k === "inlet_static_Pa" && v < 0) || (k === "diffuser_reversed_wall_length_frac" && v > 0) || (k === "yplus_max" && v > 1) ? "flag" : "";
      return `<td class="${cls}">${d === null ? v.replace("__", " ") : d === "e" ? v.toExponential(1) : v.toFixed(d)}</td>`; }).join("") + "</tr>").join("") + "</tbody></table>";
  $("sheet").querySelectorAll("th").forEach(th => { const go = () => { const k = th.dataset.k; sortDir = sortK === k ? -sortDir : 1; sortK = k; sheet(); }; th.addEventListener("click", go); th.addEventListener("keydown", e => e.key === "Enter" && go()); });
  $("sheet").querySelectorAll("tbody tr").forEach(tr => tr.addEventListener("click", () => setCase(VPS[active], tr.dataset.key)));
}
let tab = "wall";
function plots() {
  if (tab === "wall") plotWall(); else if (tab === "line") plotLine(); else if (tab === "sweep") plotSweep(); else if (tab === "conv") plotConv(); else sheet();
  const cv = $("cvVp"), cur = cv.value; cv.innerHTML = `<option value="">Active viewport</option>` + visibleVPs().map(v => `<option value="${v.n}">${v.n + 1}: ${v.key}</option>`).join(""); cv.value = [...cv.options].some(o => o.value === cur) ? cur : "";
}

// ---------------------------------------------------------------- wiring
function setLayout(n) {
  document.querySelectorAll("[data-layout]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.layout === n));
  vpwrap.className = "vpwrap l" + n; VPS.forEach(v => v.el.hidden = v.n >= n);
  if (active >= n) setActive(0);
  requestAnimationFrame(() => { resize(); rebuildAll(); refreshTree(); plots(); });
}
document.querySelectorAll("[data-layout]").forEach(b => b.addEventListener("click", () => setLayout(+b.dataset.layout)));
document.querySelectorAll("[data-cam]").forEach(b => b.addEventListener("click", () => { const tgt = UI.link ? VPS : [VPS[active]]; tgt.forEach(v => setCam(v, b.dataset.cam)); }));
$("linkCam").addEventListener("click", e => { UI.link = !UI.link; e.currentTarget.setAttribute("aria-pressed", UI.link); });
$("probeBtn").addEventListener("click", e => { UI.probe = !UI.probe; e.currentTarget.setAttribute("aria-pressed", UI.probe); status(); });
$("play").addEventListener("click", e => { UI.playing = !UI.playing; e.currentTarget.setAttribute("aria-pressed", UI.playing); e.currentTarget.lastChild.textContent = UI.playing ? "Pause" : "Play"; });
$("dye").addEventListener("click", () => { visibleVPs().forEach(v => resetP(v, "inlet")); if (!UI.playing) $("play").click(); });
const bind = (id, key, conv, after) => $(id).addEventListener(($(id).type === "range" || $(id).type === "number") ? "input" : "change", e => { const t = e.target; UI[key] = conv ? conv(t.type === "checkbox" ? t.checked : t.value) : (t.type === "checkbox" ? t.checked : t.value); (after || rebuildAll)(); });
bind("pField", "field"); bind("pCmap", "cmap"); bind("pZero", "zero"); bind("pReverse", "revFlag");
bind("pRange", "range", null, () => { if (UI.range === "custom") { UI.cmin = +$("pMin").value; UI.cmax = +$("pMax").value; } rebuildAll(); });
const custom = () => { $("pRange").value = "custom"; UI.range = "custom"; UI.cmin = +$("pMin").value; UI.cmax = +$("pMax").value; rebuildAll(); };
$("pMin").addEventListener("change", custom); $("pMax").addEventListener("change", custom);
bind("pBands", "bands", Number, () => { $("pBandsV").textContent = UI.bands || "off"; rebuildAll(); });
bind("wField", "wall"); bind("wOpacity", "wOpacity", v => v / 100, () => { $("wOpacityV").textContent = Math.round(UI.wOpacity * 100); rebuildAll(); }); bind("wSweep", "sweep", Number);
bind("sCut", "sCut"); bind("sStream", "sStream"); bind("sMesh", "sMesh"); bind("sLine", "sLine"); bind("sMeshStride", "meshStride", Number);
bind("aSeed", "seed", null, () => visibleVPs().forEach(v => resetP(v, UI.seed)));
bind("aCount", "count", Number, () => { $("aCountV").textContent = UI.count; });
const slowConv = v => 10 ** (-3.3 + 2.3 * v / 100);
bind("aSlow", "slow", slowConv, () => { $("aSlowV").textContent = "1/" + Math.round(1 / UI.slow); });
bind("aSize", "psize", v => v / 10, () => { $("aSizeV").textContent = UI.psize.toFixed(1); });
bind("aColour", "pcol", null, () => {});
$("pBandsV").textContent = "off"; $("wOpacityV").textContent = 100; $("aCountV").textContent = UI.count; UI.slow = slowConv(45); $("aSlowV").textContent = "1/" + Math.round(1 / UI.slow); $("aSizeV").textContent = UI.psize.toFixed(1);
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll(".pane").forEach(p => p.hidden = p.dataset.pane !== tab); requestAnimationFrame(plots); }));
["wpVar", "wpYmin", "wpYmax", "wpPort", "wpDiff"].forEach(id => $(id).addEventListener("input", plotWall));
$("lnDir").addEventListener("change", e => { UI.lnDir = e.target.value; UI.lnPos = UI.lnDir === "radial" ? 0.25 : 0.9; $("lnPos").value = UI.lnPos * 1000; rebuildAll(); plotLine(); });
$("lnPos").addEventListener("input", e => { UI.lnPos = e.target.value / 1000; rebuildAll(); plotLine(); });
["lnVar", "lnNorm"].forEach(id => $(id).addEventListener("input", plotLine));
$("swVar").innerHTML = SWEEP.map(([k, l]) => `<option value="${k}">${l}</option>`).join(""); $("swVar").addEventListener("change", plotSweep);
$("swGeoms").innerHTML = GEOMS.map(g => `<label><input type="checkbox" value="${g}" ${swOn.has(g) ? "checked" : ""}><i style="background:${geomColour(g)}"></i>${g}</label>`).join("");
$("swGeoms").addEventListener("change", e => { e.target.checked ? swOn.add(e.target.value) : swOn.delete(e.target.value); plotSweep(); });

function resize() {

    v.renderer.setSize(w, h, false); v.camera.aspect = w / h; v.camera.updateProjectionMatrix(); v.dirty = true; }

}
new ResizeObserver(() => resize()).observe(vpwrap);
new ResizeObserver(() => plots()).observe(document.querySelector(".bottom"));

for (let i = 0; i < 4; i++) VPS.push(makeVP(i));
await Promise.all(VPS.map((v, i) => setCase(v, defaults[i])));
setLayout(2); setActive(0);
VPS.forEach(v => setCam(v, "iso"));

let last = performance.now();
(function loop(now) {
  now = now || performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const vis = visibleVPs();
  if (UI.playing && vis.length) {
    const vmax = Math.max(...vis.map(v => Math.max(...v.D.cut_speed.flat())));
    for (const v of vis) { stepP(v, dt, null, vmax); v.dirty = true; }
  }

})();
